site_name: CrowLLM API
site_url: https://docs.crowllm.com
site_author: CrowLLM
site_description: Global LLM API Gateway - Access 40+ AI models through one unified API

theme:
  name: material
  language: en
  custom_dir: newapi/overrides
  features:
    - announce.dismiss
    - content.code.annotate
    - content.code.copy
    - content.code.select
    - content.tooltips
    - navigation.footer
    - navigation.indexes
    - navigation.path
    - navigation.sections
    - navigation.tabs
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow
    - content.tabs.link
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: purple
      accent: purple
      toggle:
        icon: material/toggle-switch
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: purple
      toggle:
        icon: material/toggle-switch-off
        name: Switch to light mode
  font: false
  favicon: assets/favicon.ico
  logo: assets/logo.png

extra:
  social:
    - icon: fontawesome/brands/discord
      link: https://discord.gg/crowllm
  generator: false

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - API Reference:
    - Overview: api/index.md
    - Chat:
      - OpenAI Chat: api/openai-chat.md
      - OpenAI Responses: api/openai-responses.md
      - Anthropic Messages: api/anthropic-chat.md
      - Google Gemini: api/google-gemini-chat.md
      - DeepSeek Reasoning: api/deepseek-reasoning-chat.md
    - Embeddings:
      - OpenAI Embeddings: api/openai-embedding.md
    - Rerank:
      - Jina AI Rerank: api/jinaai-rerank.md
      - Cohere Rerank: api/cohere-rerank.md
      - Xinference Rerank: api/xinference-rerank.md
    - Realtime:
      - OpenAI Realtime: api/openai-realtime.md
    - Image:
      - OpenAI Image: api/openai-image.md
      - Midjourney: api/midjourney-proxy-image.md
    - Audio:
      - OpenAI Audio: api/openai-audio.md
    - Music:
      - Suno Music: api/suno-music.md
    - Video:
      - Kling & Jimeng: api/kling-jimeng.md
      - OpenAI Video (Sora): api/openai-video.md
    - Utilities:
      - Get Models List: api/get-available-models-list.md
      - Token Usage: api/token-usage.md
  - Integrations:
    - 🎭 Roleplay:
      - Janitor AI: apps/janitor-ai.md
      - SillyTavern: apps/sillytavern.md
    - 💻 Coding:
      - Claude Code: apps/claude-code.md
      - Codex CLI: apps/codex-cli.md
      - Factory Droid CLI: apps/factory-droid-cli.md
      - Cursor IDE: apps/cursor-ide.md
    - 📚 Productivity:
      - Cherry Studio: apps/cherry-studio.md
      - LangBot: apps/langbot.md
      - Fluent Read: apps/fluent-read.md
      - Luna Translator: apps/luna-translator.md

plugins:
  - search:
      separator: '[\s​\-_,:!=\[\]()"`/]+|\.(?!\d)|&[lg]t;|(?!\b)(?=[A-Z][a-z])'
  - tags

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
      emoji_index: !!python/name:material.extensions.emoji.twemoji
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

watch:
  - newapi/overrides
  - docs

copyright: Copyright &copy; 2024-2026 CrowLLM
